name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Private repo: Linux only (macOS bills 10x, Windows 2x). Add windows-latest and macos-latest once public.
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer computes the version from tags

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release
      - name: Sample smoke test
        run: dotnet run --no-build -c Release --project samples/Shop

      - name: Pack
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack --no-build -c Release -o artifacts

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: packages
          path: artifacts/*
