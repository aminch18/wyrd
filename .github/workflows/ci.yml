name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer computes the version from tags

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release
      - name: Sample smoke test
        run: dotnet run --no-build -c Release --project samples/Shop.Console

      - name: Native AOT smoke test
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet publish samples/Shop.Console -c Release -o aot
          ./aot/Shop.Console

      - name: Pack
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack --no-build -c Release -o artifacts

      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: packages
          path: artifacts/*

  release:
    # A pushed tag (v1.2.3 or v1.2.3-alpha.1) becomes a GitHub Release with the packages and the changelog notes.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # Trusted Publishing: nuget.org trusts this workflow, no stored API key

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" artifacts/* --title "$GITHUB_REF_NAME" --notes-file notes.md $prerelease

      # Trusted Publishing (see docs/RELEASING.md): the repository variable NUGET_USER is the nuget.org account that
      # owns the policy. The login exchanges this run's OIDC token for an API key that expires within the hour.
      - name: Log in to nuget.org
        id: nuget
        if: vars.NUGET_USER != ''
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to nuget.org
        if: vars.NUGET_USER != ''
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: |
          for pattern in "*.nupkg" "*.snupkg"; do
            dotnet nuget push "artifacts/$pattern" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

      - name: Explain a skipped publish
        if: vars.NUGET_USER == ''
        run: echo "::notice::NUGET_USER is not set: skipping the nuget.org push (see docs/RELEASING.md)."
