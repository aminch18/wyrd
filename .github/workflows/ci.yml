name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer computes the version from tags

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      # Container tests need Docker with Linux images: only the Linux runner has it (and measures coverage).
      - name: Tests
        if: matrix.os != 'ubuntu-latest'
        run: dotnet test --no-build -c Release --filter "Category!=Containers"

      - name: Tests with coverage
        if: matrix.os == 'ubuntu-latest'
        run: >-
          dotnet test --no-build -c Release --collect:"XPlat Code Coverage"
          --results-directory TestResults
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Include="[Wyrd]*,[Wyrd.Testing]*"

      - name: Generate coverage report
        if: matrix.os == 'ubuntu-latest' && !cancelled()
        run: |
          version="$(jq -r '.reportGeneratorVersion' coverage.json)"
          dotnet tool install dotnet-reportgenerator-globaltool --tool-path .coverage-tools --version "$version"
          .coverage-tools/reportgenerator \
            '-reports:TestResults/**/coverage.cobertura.xml' \
            '-targetdir:coverage-report' \
            '-reporttypes:Html;JsonSummary' \
            '-assemblyfilters:+Wyrd;+Wyrd.Testing' \
            '-filefilters:-**/*.g.cs'

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && !cancelled()
        id: coverage-artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage-report/
          if-no-files-found: error

      - name: Report coverage and enforce release floor
        if: matrix.os == 'ubuntu-latest' && !cancelled()
        env:
          COVERAGE_ARTIFACT_URL: ${{ steps.coverage-artifact.outputs.artifact-url }}
          COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: python
        run: |
          import json
          import math
          import os
          import subprocess

          with open("coverage.json", encoding="utf-8") as file:
              floor = json.load(file)
          with open("coverage-report/Summary.json", encoding="utf-8") as file:
              report = json.load(file)
          packages = {item["name"]: item for item in report["coverage"]["assemblies"]}
          expected = {"Wyrd", "Wyrd.Testing"}
          if set(floor["packages"]) != expected or set(packages) != expected:
              raise SystemExit("Q5.2: expected coverage and floors for Wyrd and Wyrd.Testing")

          base = os.environ.get("COVERAGE_BASE", "").strip()
          prior = {}
          base_note = None
          if not base:
              raise SystemExit("Q5.2: coverage base is unset; cannot check the floor ratchet")
          if base == "0" * 40:
              base_note = "Floor ratchet skipped for a new ref with no previous commit."
          else:
              commit = subprocess.run(["git", "cat-file", "-e", f"{base}^{{commit}}"],
                                      capture_output=True, text=True, check=False)
              if commit.returncode != 0:
                  raise SystemExit(f"Q5.2: base commit {base} is unavailable; cannot check the floor ratchet")
              tree = subprocess.run(["git", "ls-tree", "--name-only", base, "--", "coverage.json"],
                                    capture_output=True, text=True, check=True)
              if tree.stdout.strip() == "coverage.json":
                  previous = subprocess.run(["git", "show", f"{base}:coverage.json"],
                                            capture_output=True, text=True, check=True)
                  prior = json.loads(previous.stdout)["packages"]
              else:
                  base_note = "Initial floor: the base commit has no coverage.json."
          failures = []
          rows = ["## Coverage (Q5.2)", "",
                  "| Package | Lines | Release floor | Branches | Release floor |",
                  "| --- | ---: | ---: | ---: | ---: |"]
          for name in sorted(expected):
              values = packages[name]
              for metric, field in (("line", "coverage"), ("branch", "branchcoverage")):
                  actual = values[field]
                  minimum = floor["packages"][name][metric]
                  if not all(isinstance(value, (int, float)) and math.isfinite(value)
                             and 0 <= value <= 100 for value in (actual, minimum)):
                      raise SystemExit(f"Q5.2: {name} has invalid {metric} coverage or floor")
                  if minimum < prior.get(name, {}).get(metric, 0):
                      failures.append(f"Q5.2: {name} {metric} floor cannot decrease: "
                                      f"{prior[name][metric]}% -> {minimum}%")
                  if actual < minimum:
                      failures.append(f"Q5.2: {name} {metric} coverage {actual}% "
                                      f"is below the release floor {minimum}%")
              rows.append(f"| {name} | {values['coverage']}% | {floor['packages'][name]['line']}% "
                          f"| {values['branchcoverage']}% | {floor['packages'][name]['branch']}% |")
          if base_note:
              rows.extend(["", base_note])
          rows.extend(["", f"[Full HTML report]({os.environ['COVERAGE_ARTIFACT_URL']})", ""])
          rows.extend(f"- {failure}" for failure in failures)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as file:
              file.write("\n".join(rows) + "\n")
          if failures:
              raise SystemExit("\n".join(failures))
      - name: Allocation gates (Q1.2, Q1.3)
        if: matrix.os == 'ubuntu-latest'
        run: dotnet run --no-build -c Release --project benchmarks/Wyrd.Benchmarks -- --gate

      - name: Build the durable Shop.Api (EF Core, JIT)
        run: dotnet build -c Release samples/Shop.Api -p:WyrdHost=EfCore
      - name: Sample smoke test
        run: dotnet run --no-build -c Release --project samples/Shop.Console

      - name: Check process snapshots
        if: matrix.os == 'ubuntu-latest'
        run: dotnet run --no-build -c Release --project src/Wyrd.Tool -- processes --assembly samples/Shop/bin/Release/net10.0/Shop.dll --check samples/Shop/processes.wyrd.txt

      - name: Native AOT smoke test
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet publish samples/Shop.Console -c Release -o aot
          ./aot/Shop.Console

      - name: Native AOT HTTP smoke test
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet publish samples/Shop.Api -c Release -o aot-api
          ./aot-api/Shop.Api --urls http://127.0.0.1:5080 > aot-api.log 2>&1 &
          api_pid=$!
          cleanup() {
            kill "$api_pid" 2>/dev/null || true
            wait "$api_pid" 2>/dev/null || true
            cat aot-api.log
          }
          trap cleanup EXIT
          ready=false
          for ((attempt = 0; attempt < 60; attempt++)); do
            if curl --fail --silent --max-time 1 http://127.0.0.1:5080/orders > /dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              echo "The native API exited before answering HTTP."
              exit 1
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            echo "The native API did not become ready within 60 attempts."
            exit 1
          fi
          bash samples/Shop.Api/smoke.sh http://127.0.0.1:5080

      - name: Pack
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack --no-build -c Release -o artifacts

      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: packages
          path: artifacts/*

  release:
    # A pushed tag (v1.2.3 or v1.2.3-alpha.1) becomes a GitHub Release with the packages and the changelog notes.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # Trusted Publishing: nuget.org trusts this workflow, no stored API key

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" artifacts/* --title "$GITHUB_REF_NAME" --notes-file notes.md $prerelease

      # Trusted Publishing (see docs/RELEASING.md): the repository variable NUGET_USER is the nuget.org account that
      # owns the policy. The login exchanges this run's OIDC token for an API key that expires within the hour.
      # Fallback: a classic API key in the NUGET_API_KEY secret.
      - name: Log in to nuget.org
        id: nuget
        if: vars.NUGET_USER != ''
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY || secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::notice::Neither NUGET_USER nor NUGET_API_KEY is set: skipping the nuget.org push (see docs/RELEASING.md)."
            exit 0
          fi
          for pattern in "*.nupkg" "*.snupkg"; do
            dotnet nuget push "artifacts/$pattern" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
