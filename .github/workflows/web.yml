name: Web

on:
  pull_request:
    paths:
      - 'src/Wyrd.Web/**'
      - 'docs/guides/**'
      - '.github/workflows/web.yml'
  push:
    branches: [main]
    paths:
      - 'src/Wyrd.Web/**'
      - 'docs/guides/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Wyrd.Web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false # the site is built and uploaded as an artifact: nothing pushes with git

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Wyrd.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Check formatting
        run: npm run format:check

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: src/Wyrd.Web/dist

  deploy:
    name: Deploy website
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
