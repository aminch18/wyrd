name: Bug report
description: Something behaves differently from what the docs promise.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the process definition and the journal output if you can.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Ideally a failing test against InMemoryRuntime. Wyrd is deterministic, so it should reproduce every time.
      render: csharp
  - type: input
    id: version
    attributes:
      label: Wyrd version
