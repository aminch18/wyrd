; PgBouncer for the load benchmark (run.sh --pgbouncer): transaction pooling, as a deployment with many worker
; processes would run it. Wyrd holds no session state (no advisory locks, LISTEN or temporary tables), so it works here.
[databases]
wyrd = host=postgres port=5432 dbname=wyrd

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
; Server connections per database and user: what PostgreSQL sees, however many clients the workers open.
default_pool_size = 50
max_client_conn = 2000
; Npgsql may prepare statements; PgBouncer 1.21+ keeps them per server connection.
max_prepared_statements = 200
ignore_startup_parameters = extra_float_digits
